[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluator"
version = "0.1.0"
description = "RAG Evaluation Orchestrator: Coordinates RAGAS, DeepEval, and LangSmith"
authors = [{name = "Viviana Pérez", email = "viviana@github.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv==1.0.0",
    "ragas>=0.1.0",
    "deepeval>=0.21.0",
    "langsmith>=0.1.0",
    "langchain>=0.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = ["pytest-asyncio", "pytest-xdist", "pytest-repeat"]
