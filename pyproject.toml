[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluator"
version = "0.1.0"
description = "RAG Evaluation Orchestrator: Coordinates RAGAS, DeepEval, and LangSmith"
authors = [{name = "Viviana Pérez", email = "viviana@github.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "datasets>=2.19,<4",
    "ragas==0.2.15",
    "deepeval>=2.9,<3",
    "langsmith>=0.3,<0.4",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "httpx>=0.27,<0.29",
]==0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv==1.0.0",
    "datasets>=2.19.0",
    "ragas>=0.1.0",
    "deepeval>=0.21.0",
    "langsmith>=0.1.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.26,<1", "pytest-xdist", "pytest-repeat"]

[tool.setuptools.packages.find]
include = ["rag_evaluator*"]
